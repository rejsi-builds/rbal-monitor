name: RBAL CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-release:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create unique version tags
        shell: bash
        run: |
          echo "VERSION=1.0.${{ github.run_number }}" >> $GITHUB_ENV
          echo "IMAGE_TAG=1.0.${{ github.run_number }}-${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build Docker image
        shell: bash
        run: docker build -t rbal-monitor:${IMAGE_TAG} .

      - name: Run container and test it
        shell: bash
        run: |
          docker run -d --name rbal-test -p 18081:8081 rbal-monitor:${IMAGE_TAG}
          sleep 10
          curl --fail http://localhost:18081/
          curl --fail http://localhost:18081/api/status

      - name: Remove test container
        if: always()
        shell: bash
        run: docker rm -f rbal-test

      - name: Save image as a file
        shell: bash
        run: docker save rbal-monitor:${IMAGE_TAG} | gzip > rbal-monitor-${IMAGE_TAG}.tar.gz

      - name: Create GitHub release with the image
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: RBAL Monitor v${{ env.VERSION }}
          body: "Docker image tag: rbal-monitor:${{ env.IMAGE_TAG }}"
          files: rbal-monitor-${{ env.IMAGE_TAG }}.tar.gz

      - name: Deploy new container on this PC
        shell: bash
        run: |
          docker rm -f rbal-monitor-app || true
          docker run -d --restart unless-stopped --name rbal-monitor-app -p 8081:8081 rbal-monitor:${IMAGE_TAG}

  deploy-pages:
    needs: build-and-release
    runs-on: self-hosted
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload web folder
        uses: actions/upload-pages-artifact@v4
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4