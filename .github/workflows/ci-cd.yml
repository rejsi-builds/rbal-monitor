name: RBAL CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-release:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create unique version tags
        run: |
          $version = "1.0.${{ github.run_number }}"
          $sha = "${{ github.sha }}".Substring(0, 7)
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "IMAGE_TAG=$version-$sha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Docker image
        run: |
          docker build -t rbal-monitor:${{ env.IMAGE_TAG }} .
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Run container and test it
        run: |
          docker run -d --name rbal-test -p 18081:8081 rbal-monitor:${{ env.IMAGE_TAG }}
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Start-Sleep -Seconds 10
          Invoke-WebRequest -UseBasicParsing -Uri http://localhost:18081/ | Out-Null
          Invoke-WebRequest -UseBasicParsing -Uri http://localhost:18081/api/status | Out-Null
          Write-Host "Container test passed"

      - name: Remove test container
        if: always()
        run: |
          docker logs rbal-test
          docker rm -f rbal-test
          exit 0

      - name: Save image as a file
        run: |
          docker save -o rbal-monitor-${{ env.IMAGE_TAG }}.tar rbal-monitor:${{ env.IMAGE_TAG }}
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Create GitHub release with the image
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: RBAL Monitor v${{ env.VERSION }}
          body: "Docker image tag: rbal-monitor:${{ env.IMAGE_TAG }}"
          files: rbal-monitor-${{ env.IMAGE_TAG }}.tar

      - name: Deploy new container on this PC
        run: |
          docker rm -f rbal-monitor-app
          docker run -d --restart unless-stopped --name rbal-monitor-app -p 8081:8081 rbal-monitor:${{ env.IMAGE_TAG }}
          if ($LASTEXITCODE -ne 0) { exit 1 }

  deploy-pages:
    needs: build-and-release
    runs-on: self-hosted
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload web folder
        uses: actions/upload-pages-artifact@v4
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4